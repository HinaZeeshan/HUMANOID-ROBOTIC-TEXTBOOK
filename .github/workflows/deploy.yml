name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - 001-humanoid-rag-textbook # This matches your current feature branch name

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Docusaurus Dependencies
        run: npm install
        working-directory: ./my-textbook # Your Docusaurus project folder

      - name: Build Docusaurus Website
        run: npm run build
        working-directory: ./my-textbook # Your Docusaurus project folder

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/001-humanoid-rag-textbook' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./my-textbook/build # Your Docusaurus build output folder
          cname: # Optional: if you have a custom domain (leave blank if not using one)
