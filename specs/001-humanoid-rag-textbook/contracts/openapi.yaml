openapi: 3.0.0
info:
  title: Humanoid Robotics Textbook Chatbot API
  version: 1.0.0
  description: API for the RAG chatbot embedded in the Docusaurus textbook.

paths:
  /api/v1/chat:
    post:
      summary: Send a query to the RAG chatbot
      operationId: postChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: The user's question.
                  example: "What is a digital twin?"
                sessionId:
                  type: string
                  description: Optional ID to maintain conversational context.
                  example: "abc-123-def-456"
              required:
                - query
      responses:
        '200':
          description: Successful response from the chatbot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: The chatbot's generated answer.
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        displayName:
                          type: string
                          description: The display name of the source document.
                        uri:
                          type: string
                          description: A URI pointing to the source document.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: A message detailing the error.