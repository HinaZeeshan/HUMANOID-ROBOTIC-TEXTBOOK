## POST /api/query-selected-text

**Description**: Endpoint to query specifically selected text in the book

**Request**:
- Method: POST
- Content-Type: application/json
- URL: `/api/query-selected-text`

**Request Body**:
```json
{
  "question": "string (required) - The user's question about the selected text",
  "selected_text": "string (required) - The text that was selected by the user",
  "session_id": "string (optional) - Session identifier for conversation context"
}
```

**Response**:
- Status: 200 OK
- Content-Type: application/json

```json
{
  "answer": "string - The generated answer based only on the selected text",
  "source_citations": [
    {
      "section_id": "string - ID of the book section used",
      "title": "string - Title of the referenced section",
      "location": "string - Path/identifier for where this section exists in the book"
    }
  ],
  "session_id": "string - Session identifier (newly created if not provided)"
}
```

**Error Responses**:
- 400 Bad Request: Invalid request body format
- 422 Unprocessable Entity: Missing required fields (especially selected_text)
- 500 Internal Server Error: Server error during processing

