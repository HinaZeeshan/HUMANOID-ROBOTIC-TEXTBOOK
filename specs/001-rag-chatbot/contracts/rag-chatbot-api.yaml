## GET /api/sessions/{session_id}

**Description**: Retrieve a specific chat session with its messages

**Request**:
- Method: GET
- URL: `/api/sessions/{session_id}`

**Path Parameters**:
- `session_id`: string - The ID of the session to retrieve

**Response**:
- Status: 200 OK
- Content-Type: application/json

```json
{
  "session_id": "string - The session identifier",
  "created_at": "timestamp - When the session was created",
  "updated_at": "timestamp - When the session was last updated",
  "messages": [
    {
      "id": "string - Message identifier",
      "role": "string - Either 'user' or 'assistant'",
      "content": "string - The message content",
      "timestamp": "timestamp - When the message was created",
      "source_citations": "array - Citations if this is an assistant message"
    }
  ]
}
```

**Error Responses**:
- 404 Not Found: Session with given ID does not exist
- 500 Internal Server Error: Server error during processing