version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/robotics_book
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    depends_on:
      - db
      - qdrant
    volumes:
      - ./src:/app/src  # For development

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: robotics_book
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: